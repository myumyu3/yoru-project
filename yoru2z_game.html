<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヨルと星の鐘　第三章編</title>
<style>
:root{--bg:#191919;--surface:#202020;--raised:#2b2b2a;--text:#fff;--sub:rgba(255,255,255,.65);--border:rgba(255,255,255,.16);--accent:#5E9FE8;--gold:#EAC26B;--red:#E97366;--green:#72BC8F;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;line-height:1.9;font-size:16px;-webkit-font-smoothing:antialiased}
#ash{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:12px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 8px;color:var(--sub);font-size:13px}
.topbar button{background:none;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:8px 14px;min-height:40px;font-size:13px;cursor:pointer;font-family:inherit}
.topbar button:hover{border-color:var(--accent);color:var(--text)}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.stats .st{white-space:nowrap}
.stats .st b{color:var(--gold)}
.stats .bag{margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;color:var(--sub);padding:5px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.baglist{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;margin:-4px 0 10px;font-size:14px;color:rgba(255,255,255,.85)}
.scene{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 20px 24px;animation:fade .45s ease}
.scenehead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:4px}
.scenehead .no{font-size:13px;color:var(--sub);white-space:nowrap}
.scenehead h2{font-size:20px;line-height:1.5}
.paras p{margin:14px 0;color:rgba(255,255,255,.92)}
.gain{margin:12px 0;padding:9px 14px;border-radius:8px;font-size:14px;border:1px solid rgba(234,194,107,.4);color:var(--gold);background:rgba(234,194,107,.08)}
.fxnote{margin:12px 0;padding:9px 14px;border-radius:8px;font-size:14px;border:1px solid var(--border);color:var(--sub);background:rgba(255,255,255,.03)}
.banner{margin:18px 0 4px;padding:14px 16px;border-radius:10px;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.04)}
.banner .big{font-size:19px;font-weight:700;letter-spacing:.08em}
.ask{margin:22px 0 10px;color:var(--sub);font-size:13px;letter-spacing:.18em}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{display:block;width:100%;text-align:left;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:16px;min-height:48px;line-height:1.6;cursor:pointer;font-family:inherit;transition:border-color .15s}
.choices button:hover,.choices button:focus-visible{border-color:var(--accent)}
.choices button.item{border-color:rgba(234,194,107,.45)}
.choices button.luckbtn{border-color:rgba(94,159,232,.45)}
.enemy{margin:16px 0 6px;padding:14px 16px;border-radius:10px;border:1px solid rgba(233,115,102,.45);background:rgba(233,115,102,.07)}
.enemy .en{font-weight:700;font-size:17px}
.enemy .es{font-size:14px;color:var(--sub);margin-top:2px}
.dicelog{margin:12px 0;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:15px}
.dicelog .dice{font-size:22px;letter-spacing:.1em}
.dicelog .ok{color:var(--green)} .dicelog .ng{color:var(--red)}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 8px;animation:fade .6s ease}
.title .candle{font-size:40px;margin-bottom:12px}
.title h1{font-size:30px;letter-spacing:.12em;margin-bottom:6px}
.title .ser{color:var(--sub);font-size:13px;margin-bottom:6px;letter-spacing:.2em}
.title .sub{color:var(--sub);font-size:15px;margin-bottom:26px}
.title .start{background:rgba(94,159,232,.14);border:1px solid var(--accent);color:var(--text);font-size:17px;font-family:inherit;border-radius:10px;padding:13px 40px;min-height:50px;cursor:pointer;letter-spacing:.1em;margin-bottom:10px}
.title .start:hover{background:rgba(94,159,232,.24)}
.title .cont{background:none;border:1px solid var(--border);color:var(--sub);font-size:14px;font-family:inherit;border-radius:10px;padding:10px 28px;min-height:44px;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px;max-width:440px}
.badge{border:1px solid var(--border);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--sub);background:var(--surface)}
.badge.got{color:var(--gold);border-color:rgba(234,194,107,.45)}
.title .note{color:var(--sub);font-size:12px;margin-top:16px}
.cgen{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px 20px;text-align:center;animation:fade .45s ease}
.cgen h2{font-size:20px;margin-bottom:14px}
.cgen .rolls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0 18px}
.cgen .r{border:1px solid var(--border);border-radius:10px;padding:10px 18px;min-width:88px}
.cgen .r .lbl{font-size:13px;color:var(--sub)}
.cgen .r .val{font-size:24px;font-weight:700;color:var(--gold)}
.cgen .hint{font-size:13px;color:var(--sub);margin-bottom:16px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.scene,.title,.cgen{animation:none}}
@media (max-width:420px){#app{padding:10px 12px 32px}.scene{padding:16px 14px 20px}.title h1{font-size:26px}}
</style>
</head>
<body>
<canvas id="ash" aria-hidden="true"></canvas>
<main id="app"></main>
<script>
"use strict";
const SCENES = {"1":{"id":1,"ch":3,"n":"あけないあさ","i":"🌃","p":["めざましの鐘がわれてから、せかいには、あさがこない。しずかの谷のひとたちは、ゆきのしたでねむったまま。めをさましたのは、りすのゆうびん屋・ポストンさん、ただひとり。ヨルのかばんのなかで、ふたつの鐘のかけらが、よりそってひかっている。","「かけらは、みっつで、ひとそろい」と、ポストンさんはいった。「さいごのひとつは——鐘の山の、いただきに」"],"c":[{"t":"ゆうびん局へ","to":2}]},"2":{"id":2,"ch":3,"n":"ポストンさんのはなし","i":"🐿️","p":["「谷の鐘はね、こどもの鐘なんです。おやの鐘は、山のいただきにある。名まえは——」ポストンさんは、そこでこえをひそめた。「……いえ。名まえは、ここでは、いわないでおきましょう」","「おやの鐘がなれば、こどもの鐘たちが、こたえてなきます。そうしたら、あさがきます。でも、あの山は……のぼるひとから、いろんなものを、とっていく山なのです」"],"c":[{"t":"話のつづきをきく","to":3}]},"3":{"id":3,"ch":3,"n":"なまえのてちょう","i":"📔","p":["ポストンさんは、ちいさなてちょうを、ヨルのてのひらにのせた。ひょうしに『なまえのてちょう』とある。ひらくと、ていねいな字で、だいじな名まえが、ぜんぶ、かきとめてあった。ヨル。モモ。ホシ。ポストン。しずかの谷。……ぜんぶだ。","「山のうえでは、じぶんの名まえさえ、あやしくなるといいます。わすれたら、よむこと。よんだら、おもいだすこと。……どうか、それだけは」"],"get":["techo"],"c":[{"t":"てちょうをしまう","to":4}]},"4":{"id":4,"ch":3,"n":"旅のしたく","i":"🎒","p":["ポストンさんは、たなのおくから、あれこれとりだしてくれた。めのさめる、つめたいしみずのびん。まちのじまんの、くるみのふくろ。それから、ほしいろにひかる、じょうぶなひも。","「山みちは、ながいですよ。つかいどころは、よくえらんで」モモが、ひもをくるくるまいて、かばんにしまった。"],"get":["mizu","kurumi","himo"],"c":[{"t":"しゅっぱつする","to":5}]},"5":{"id":5,"ch":3,"n":"みおくり","i":"👋","p":["村のはずれまで、ポストンさんはついてきて、いつまでも手をふっていた。「かえってきたら、あつあつのくるみがゆを、つくりますからね」","ふりかえると、ねむる村のやねやねが、ゆきあかりのなかにしずんでいた。あの家々のしたで、みんなが、あさをまっている。……いってきます。かならず、あさをつれて。"],"c":[{"t":"山みちへ","to":6}]},"6":{"id":6,"ch":3,"n":"くらい山みち","i":"🌲","p":["谷をでると、みちは、くろい木立のなかをのぼりはじめた。空には星もなく、ただ、ホシのランタンのあかりだけが、ゆきのうえに、まるいひかりのわをおとしている。","「ねえ、ヨル」モモがささやいた。「この山、しずかの谷より……もっと、しずかだね」ほんとうだ。風の音さえ、とおくで、きえいりそうだった。"],"c":[{"t":"のぼる","to":7}]},"7":{"id":7,"ch":3,"n":"石の鳥居","i":"⛩️","p":["みちのはじまりに、古い石の鳥居が立っていた。くぐるまえに、ランタンのなかで、ホシが、ちか、ちか、とまたたいた。……なにも、おこらない。","鳥居のわきに、こけむした石碑がある。なにか、ほってあるようだ。"],"c":[{"t":"石碑をよむ","to":8}]},"8":{"id":8,"ch":3,"n":"かすれた石碑","i":"🪨","p":["『やまの、ならわし。","いち。やまで、なまえを□□□□。","に。よぶこえに、□□□□□□□。","さん。いただきで、□□□□□□□□。』","だいじなところが、ぜんぶ、かすれてよめない。ゆびでなぞっても、石は、つめたいだけだった。「……なまえを、どうしろって？」モモのこえが、すこしだけ、ふるえた。"],"c":[{"t":"とりいをくぐる","to":9}]},"9":{"id":9,"ch":3,"n":"一合目・灰の野","i":"🌫️","p":["鳥居のさきは、ひろい灰の野だった。ゆきとまざった灰が、ひざのたかさまでつもって、いっぽ、いっぽが、おもい。","みちのわきに、岩がてんてんと、つらなっている。岩づたいにとべば、ちかみちになりそうだ。"],"c":[{"t":"岩づたいに、とんでいく","luck":[10,11]},{"t":"みちなりに、ゆっくりすすむ","to":12}]},"10":{"id":10,"ch":3,"n":"岩づたいのちかみち","i":"🐾","p":["ひょい、ひょい、と岩から岩へ。モモが、ちいさくはくしゅした。「ヨル、やまのけものみたい」","ずいぶん、みちがはかどった。からだも、ぽかぽかしてきた。"],"fx":{"un":1},"c":[{"t":"すすむ","to":12}]},"11":{"id":11,"ch":3,"n":"灰だまり","i":"💨","p":["さいごの岩で、足がすべった。ぼふっ。灰だまりに、こしまでうまる。つめたいような、くすぐったいような、いやなかんじだ。","モモにひっぱりだしてもらうと、ふたりとも、あたまのてっぺんまで、まっしろになっていた。"],"fx":{"genki":-1},"c":[{"t":"灰をはらって、すすむ","to":12}]},"12":{"id":12,"ch":3,"n":"みちづれ","i":"🧍","p":["灰の野のまんなかで、だれかが、こちらへおりてくる。ぼうしをふかくかぶった、旅すがたのひとだ。すれちがいざま、そのひとは、たちどまった。","「……のぼるのかい。ふたりで、えらいねえ」ぼうしのおくで、めが、やさしくほそめられた。「わたしのことは、いいから。——ぼうやたちの名まえを、きかせておくれよ」"],"c":[{"t":"名まえをなのって、あいさつする","to":101},{"t":"だまって、えしゃくだけする","to":13},{"t":"「あなたの名まえは？」と、ききかえす","to":14}]},"13":{"id":13,"ch":3,"n":"えしゃく","i":"🤫","p":["ヨルはだまって、ぼうしのひとに、ぺこりとあたまをさげた。モモも、あわてて、それにならう。","ぼうしのひとは、しばらくこちらを見ていたが、やがて、すうっと、すれちがっていった。ふりかえると——灰の野には、もう、だれもいなかった。足あとさえ、なかった。"],"c":[{"t":"さきをいそぐ","to":15}]},"14":{"id":14,"ch":3,"n":"名まえのないひと","i":"🫥","p":["「わたしの、名まえ……？」ぼうしのひとは、くびをかしげた。「あれ。……あれれ。たしか、あったんだよ。いいのが、ひとつ。やまにきたときは、たしかに……」","ぼうしのしたのかおが、こまったようにわらって——そのまま、すな山がくずれるみたいに、さらさらと、灰になってくずれた。ぼうしだけが、ゆきのうえに、ぽつんとのこった。モモが、ヨルのそでを、ぎゅっとにぎった。"],"c":[{"t":"……さきへ","to":15}]},"15":{"id":15,"ch":3,"n":"二合目・わかれみち","i":"🪧","p":["みちがふたつにわかれていた。なだらかだけどながい石段と、みじかいけどけわしい、くさり場。","くさり場の岩には、むかしのひとがうちこんだ、さびた金具がのこっている。ほしいろのひもがあれば、からだをむすんで、あんぜんにのぼれそうだ。"],"c":[{"t":"石段を、こつこつのぼる","to":16},{"t":"くさり場に、ちょうせんする","luck":[17,18]},{"t":"ひもでからだをむすんで、くさり場をのぼる","use":"himo","to":17}]},"16":{"id":16,"ch":3,"n":"ながい石段","i":"🪨","p":["石段は、どこまでもつづいた。ひと段ごとに、むかしのひとがほった、ちいさな星のしるしがある。ふみながら、かぞえながら、のぼる。","三百をこえたあたりで、かぞえるのをやめた。足が、ぼうのようだ。でも、みちは、たしかだった。"],"fx":{"genki":-1},"c":[{"t":"三合目へ","to":19}]},"17":{"id":17,"ch":3,"n":"くさり場のうえ","i":"⛓️","p":["さいごのくさりをにぎって、いっきに、のぼりきった。見下ろすと、灰の野が、もう、まめつぶみたいだ。","「よゆうだったね！」モモのほっぺが、さむさとうれしさで、まっかだった。なんだか、いける気がしてきた。"],"fx":{"un":1},"c":[{"t":"三合目へ","to":19}]},"18":{"id":18,"ch":3,"n":"すべった！","i":"💨","p":["くさり場のとちゅうで、手がすべった。がけのしたの灰だまりまで、ずるずる、どすん。いたいし、つめたいし、さんざんだ。","モモが、うえから心配そうにのぞきこんでいる。けっきょく、とおまわりして、石段をのぼった。"],"fx":{"genki":-2},"c":[{"t":"三合目へ","to":19}]},"19":{"id":19,"ch":3,"n":"三合目のあかり","i":"🏮","p":["くらい山はらに、ぽつんと、ひとつだけ、あたたかいあかりが見えた。ちかづくと、ちいさな茶屋だ。のきさきのちょうちんが、風もないのに、ゆれている。","こんな山のうえに、だれが……？"],"c":[{"t":"茶屋へ","to":20}]},"20":{"id":20,"ch":3,"n":"茶屋のじいさん","i":"🍵","p":["茶屋のなかでは、白いひげのじいさんがひとり、火ばちのそばにすわっていた。ふたりを見ても、おどろかない。まるで、ずっとまっていたみたいに。","「……のぼるのかい。こんな山に、なんの用だね」"],"c":[{"t":"「鐘のかけらを、かえしにいくの」","to":21}]},"21":{"id":21,"ch":3,"n":"じいさんのとい","i":"👁️","p":["じいさんは、ながいこと、だまって火ばちの火を見ていた。それから、ひくいこえで、きいた。","「……おまえさんたち。じぶんの名まえは、まだ、もっとるかね」"],"c":[{"t":"「もってるよ」","to":22},{"t":"なまえのてちょうを、見せる","req":["techo"],"to":23},{"t":"だまって、うなずく","to":22}]},"22":{"id":22,"ch":3,"n":"じいさんのお茶","i":"🍵","p":["「そうかい。なら、いい」じいさんは、あつい茶をふたつ、だしてくれた。お茶は、ほしのあとあじがした。","「……この山はな、のぼるものから、名まえをとる。とられたら、しまいじゃ。かえりみちが、わからんようになる」じいさんは、それだけいうと、また火ばちの火を見つめた。"],"fx":{"genki":2},"c":[{"t":"おれいをいって、たつ","to":24}]},"23":{"id":23,"ch":3,"n":"てちょうとじいさん","i":"📔","p":["てちょうを見せると、じいさんのめが、ふっとやわらいだ。「……よう書けたてちょうじゃ。りすの字じゃな。あやつ、まだ、げんきかの」ページをめくるゆびが、なつかしそうだった。","「その てちょうにな、もうすぐ、あたらしい名まえがふえる。だいじにしんさい」じいさんは、あつい茶と、ちいさなつつみをくれた。ほしのお茶の、つつみだった。"],"get":["cha"],"fx":{"genki":2,"un":1},"c":[{"t":"おれいをいって、たつ","to":24}]},"24":{"id":24,"ch":3,"n":"茶屋をあとに","i":"🍂","p":["「気をつけてな」じいさんは、みおくりにはたたなかった。ただ、ひとりごとみたいに、つぶやいた。","「……上で、また、あおうかの」ふりかえったとき、茶屋のあかりは、もう、きえていた。"],"c":[{"t":"四合目へ","to":25}]},"25":{"id":25,"ch":3,"n":"四合目・風のみち","i":"🌬️","p":["みちは、尾根のはらにでた。風が、ふきはじめた。灰とゆきをまきあげて、ほおに、ちくちくささる。","風のなかに、ときどき、なにかの、こえのようなものがまじる。"],"c":[{"t":"すすむ","to":26}]},"26":{"id":26,"ch":3,"n":"みちばたのほこら","i":"⛩️","p":["みちばたに、ちいさなほこらがあった。やねのしたに、すずのもよう。だれかがそなえた、ちいさな星のかざりが、色あせてころがっている。","モモが、かじかんだ手をあわせた。"],"c":[{"t":"いっしょに、おまいりする","to":27,"fx":{"un":1}},{"t":"えしゃくして、すぎる","to":27}]},"27":{"id":27,"ch":3,"n":"風のささやき","i":"🎶","p":["風が、つよくなった。そして——きこえる。風のおくで、だれかが、うたっている。ことばになる、すこしまえの、うたのようなもの。","きいてはいけない気もする。でも、あのうたは、なにかを、つたえようとしている気もする。"],"c":[{"t":"みみをふさいで、とおりぬける","to":29},{"t":"う ,"p":["ひとつ、ふたつ、みっつ。いきをあわせて、とんでいく。さいごのひとつは、モモと手をつないで、せーの、でとんだ。","むこうぎしの土は、ひさしぶりに、かたかった。"],"c":[{"t":"すすむ","to":58}]},"57":{"id":57,"ch":3,"n":"灰のかわに、かた足","i":"💦","p":["よっつめの石が、ぐらりとかたむいた。かた足が、ひざまで灰のながれにしずむ。つめたくはない。つめたくないのが、かえって、こわい。灰は、やわらかく、ひっぱるのだ。","モモがひっしにひっぱってくれて、なんとか、ぬけだした。"],"fx":{"genki":-2},"c":[{"t":"むこうぎしへ","to":58}]},"58":{"id":58,"ch":3,"n":"むこうぎし","i":"🌑","p":["むこうぎしで、くつのなかの灰をはらった。ふりかえると、灰のかわは、なにごともなかったように、さらさらながれている。","「このかわ、どこへながれてくんだろう」モモがつぶやいた。しらないほうが、いい気がした。"],"c":[{"t":"のぼりみちへ","to":59}]},"59":{"id":59,"ch":3,"n":"のぼりなおし","i":"🥾","p":["のぼりみちは、つづらおりに、うえへ、うえへ。いきが、しろい。……いや、しろいのは、いきじゃなくて、灰なのかもしれない。もう、どちらでも、おなじことだ。","あしもとばかり見ていたから、みちのさきの、くろいかげに、きづくのがおくれた。"],"c":[{"t":"かげに、ちかづく","to":60}]},"60":{"id":60,"ch":3,"n":"あれた山ごや","i":"🛖","p":["くろいかげは、つぶれかけた山ごやだった。とびらは、はんぶん、灰にうもれている。ひとのけはいは、ない。ずっとまえから、ない。","……なかを、見ていこうか。"],"c":[{"t":"なかをしらべる","to":61},{"t":"とまらずに、すすむ","to":62}]},"61":{"id":61,"ch":3,"n":"山ごやの書きおき","i":"📜","p":["こやのなかは、からっぽだった。つくえのうえに、灰をかぶった書きおきが、いちまい。ランタンのなかで、ホシが、ちか、ちか、とまたたいた。……なにも、おこらない。","『名まえは、ともしびである。名まえをうしなったものから、こえをうしない、かたちをうしない、灰になる。この山の灰は、ぜんぶ、むかし、なにかの名まえだった』——さいごのぎょうは、ふるえた字だった。『わたしの名まえは、たしか——』そのさきは、灰で、よめなかった。"],"c":[{"t":"こやをでる","to":62}]},"62":{"id":62,"ch":3,"n":"八合目ちかく","i":"🏔️","p":["みちは、いよいよ、ほそくなる。みぎもひだりも、くらい灰の谷だ。ふたりは、だまって、あるいた。この山では、しずかにしているのが、いちばん、あんぜんな気がしたから。","でも、しずかだと——モモの、ちいさなひとりごとが、きこえてしまう。"],"c":[{"t":"みみをすます","to":63}]},"63":{"id":63,"ch":3,"n":"モモのくちずさみ","i":"🍑","p":["「モモ。モモ。わたしは、モモ。モモ、モモ、わたしはモモ……」","モモは、じぶんの名まえを、ちいさなこえで、なんども、なんども、くりかえしていた。おとしものをしないように、にぎりしめるみたいに。ヨルは、なにもいえなくて、ただ、ポケットのてちょうを、うわぎのうえから、そっとおさえた。"],"c":[{"t":"八合目のほこらへ","to":64}]},"64":{"id":64,"ch":3,"n":"八合目のほこら","i":"⛩️","p":["八合目に、石づみのしっかりしたほこらがあった。ここだけ、灰がつもっていない。だれかが、まもっているばしょなのだと、からだでわかる。","ふたりは、ほこらののきさきで、すこしだけ、いきをととのえた。"],"c":[{"t":"ほこらのなかを見る","to":65}]},"65":{"id":65,"ch":3,"n":"ほこらの書きつけ","i":"📜","p":["ほこらのなかに、ふるい書きつけが、きちんとたたんでのこされていた。ここのは、かすれていない。","『やまの、ならわし。","いち。やまで、なまえをやるな。なのるのも、さけぶのも、おなじこと。","に。よぶこえに、へんじをするな。こたえたら、つれていかれる。","さん。いただきで、いそいでならすな。鐘は、名をよばれ 山になんもかもとられても、名まえだけは、やらなんだ。鐘つきは、名をよぶのがしごとじゃからの」じいさまは、かけらをヨルのてのひらにのせた。「さいごのひとかけらじゃ。……たのむよ。わしには、もう、ならせん」"],"get":["k3"],"c":[{"t":"鐘つき堂へ","to":96}]},"95":{"id":95,"ch":3,"n":"いそぎのつりがね","i":"🔔","p":["堂のなかに、おおきなつりがねがあった。ひびのはいった、ふるいふるい鐘。つきぼうも、ちゃんとさがっている。","いますぐならせば、あさがくるのだろうか。でも、ほこらの書きつけが、あたまをよぎる。『いただきで、いそいでならすな』——。"],"c":[{"t":"ちからいっぱい、ならす","to":106},{"t":"手をとめて、じいさまのところへもどる","to":94}]},"96":{"id":96,"ch":3,"n":"みっつのかけら","i":"🔔","p":["つりがねのひびのところに、かけらのはまるべきくぼみが、みっつあった。だいざのうえに、なにか書きつけのようなものも見える。","ふたりは、かけらをてのひらにならべた。いち、に、さん。ぜんぶ、そろった。"],"c":[{"t":"そっと、ならべあわせる","to":97},{"t":"だいざの書きつけをよむ","to":98}]},"97":{"id":97,"ch":3,"n":"かけらをつなぐ","i":"✨","p":["かけらを、ひとつ、ふたつ、みっつ。くぼみにはめていく。さいごのひとつが、かちりとはまったとき——ランタンのなかのホシが、いままででいちばん、つよくひかった。","鐘のひびが、ほしのいろのひかりで、すうっととじていく。でも、鐘は、まだならない。しずかに、まっている。"],"c":[{"t":"ならすまえに","to":99}]},"98":{"id":98,"ch":3,"n":"かすれた書きつけ","i":"📜","p":["だいざの書きつけは、ふるくて、ほとんどかすれていた。よめたのは、すこしだけ。","『鐘の名は、「ア」……』そのさきは、ながいとしつきにけずられて、よめない。だれかが、わざとけずったようにも、見えた。"],"c":[{"t":"かけらのところへもどる","to":96}]},"99":{"id":99,"ch":3,"n":"ならすまえに","i":"🕯️","p":["「ならすまえにな」いつのまにか、じいさまが堂のいりぐちにたっていた。「名を、よんでやってくれ。鐘は、名をよばれてから、なるものじゃ。ずっと、だれにもよばれなんだの」","ランタンのなかで、ホシのひかりが、ふっ、ふっ、とゆれた。もうすぐ、きえてしまいそうに。せかいじゅうが、いきをのんで、ヨルのくちもとを見ている。……鐘の名まえ。鐘の名まえは——。"],"c":[{"t":"いまだ！","to":100}]},"100":{"id":100,"ch":3,"n":"さいごのよびかけ","i":"⭐","p":["つりがねのまえで、ヨルは、いきをすいこんだ。あたまのなかが、しろくなりかける。山は、さいごのさいごまで、名まえをほしがる。","モモが、ヨルの手をにぎった。「だいじょうぶ。ヨルなら、よべる」"],"c":[{"t":"「アサ！」とよぶ","req":["asa"],"to":109},{"t":"風のうたをおもいだして、「アサ」とよぶ","req":["kaze"],"to":109},{"t":"おもいだせないまま、そっとつく","to":108},{"t":"いそいで、ちからいっぱいならす","to":106},{"t":"ならさずに、やまをおりる","to":107}]},"101":{"id":101,"ch":3,"n":"なのりのおわり","i":"🌀","p":["「わたしは、ヨル」——そうこたえたとたん、みちづれのかたちが、ふわりとほどけた。灰は、うずをまいて、ヨルのまわりをとりかこむ。さむくはない。ただ、すうっと、からだがかるくなっていく。","「ヨル！ヨル、ヨル！」モモが、なんどもなんどもよんでくれる。そのこえは、とおく、とおくなって——やがて、なにもきこえなくなった。","山のどこかで、あたらしい灰が、さらさらとふった。……それでも、モモはさいごまで、その名まえをよぶのを、やめなかったという。","**BAD END：なのりのおわり**——やまで、なまえをやるな"],"c":[{"t":"タイトルにもどる","to":0}],"end":"BAD"},"102":{"id":102,"ch":3,"n":"みなものへんじ","i":"💧","p":["「はーい」——へんじをしたとたん、みなものじぶんが、にこりとわらった。じぶんは、わらっていないのに。","井戸の水が、すうっとせりあがってきて、つめたいゆびさきが、ヨルのて首をつかんだ。「ヨル！」モモのこえ。モモの手。でも、みなものなかの『ヨル』も、おなじつよさで、ひっぱる。","どちらがほんもののヨルなのか、井戸のなかでは、もう、わからない。","**BAD END：みなものへんじ**——よぶこえに、へんじをするな"],"c":[{"t":"タイトルにもどる","to":0}],"end":"BAD"},"103":{"id":103,"ch":3,"n":"巣の小石","i":"🪨","p":["小石をポケットにいれたとたん、空が、さけぶようにないた。大鳥のこえだ。それは、いかりのこえではなくて——ひなをなくしたおやの、しぼむこえだった。","灰のあらしが、山ごとふたりをのみこむ。ヨルは、さいごまで、その小石をにぎりしめていた。あたたかかった。たまごみたいに、あたたかかったのだ。","**BAD END：巣の小石**——たいせつなものは、たいせつなままに"],"c":[{"t":"タイトルにもどる","to":0}],"end":"BAD"},"104":{"id":104,"ch":3,"n":"きりのこえのほうへ","i":"⚪","p":["こえのほうへ、いっぽ、ふみだしたとたん——つないでいた手が、するりとはなれた。「ヨル？」うしろで、ほんもののモモのこえがした。ふりかえったのに、そこには、しろいやみしかなかった。","「ヨルー、こっちだよー」こえは、まえからも、うしろからも、きこえる。どっちもおなじ、やさしいこえだ。ヨルは、もう、どちらへもあるけなくなった。","**BAD END：きりのこえ**——きりは、いつかはれる"],"c":[{"t":"タイトルにもどる","to":0}],"end":"BAD"},"105":{"id":105,"ch":3,"n":"大ごえのなまえ","i":"🌫️","p":["「わたしは、ヨルだよ！」——大ごえでさけんだとたん、そのこえは、きりにすいこまれて、とけていった。さけんだはずの名まえが、じぶんでも、おもいだせない。","「……あなた、だれ？」モモが、そうきく。ヨルも、おなじことをききたかった。ふたりは、しらないひとどうしのまま、しろいやみのなかにたっていた。","**BAD END：大ごえのなまえ**——手のあたたかさだけは、のこっていた"],"c":[{"t":"タイトルにもどる","to":0}],"end":"BAD"},"106":{"id":106,"ch":3,"n":"よるのかね","i":"🔔","p":["ごぉーん——つりがねは、たしかになった。でも、その音は、どこかさびしくて、つめたかった。名をよばれないままならされた鐘の、なきごえだったのかもしれない。","空は、しらまなかった。それどころか、よるが、いっそうふかくなった気がした。じいさまが、なにもいわずに、ヨルのあたまに、そっと手をのせた。その手は、ふるえていた。","**BAD END：よるのかね**——いただきで、いそいでならすな"],"c":[{"t":"タイトルにもどる","to":0}],"end":"BAD"},"107":{"id":107,"ch":3,"n":"いつかのあさ","i":"🌙","p":["ヨルは、つりがねにせをむけた。「……まだ、よべない。ちゃんと名まえをしらべてから、もういちどくる」じいさまは、すこしわらって、うなずいた。「鐘は、にげん。わしも、にげん」","かえりみち、モモはヨルの手を、ずっとにぎっていた。「つぎは、ぜったい、ならそうね」「うん。つぎは、きっと」——あさは、まだこない。でも、やくそくは、もうある。","**END：いつかのあさ**——やくそくは、もうある"],"c":[{"t":"タイトルにもどる","to":0}],"end":"END"},"108":{"id":108,"ch":3,"n":"とおくのあさ","i":"🌅","p":["名まえをよべないまま、ヨルは、そっとつりがねをついた。ごぉ……ん。音は、やさしかった。でも、どこか、ねぼけたままだった。","空のはしっこが、ほんのすこし、しろくなった。あさ……には、ならなかった。でも、よるでもない。そのあいだの、とおくのあさ。じいさまはいった。「鐘は、はんぶんだけ、めをさました。名をよばれれば、いつか、ちゃんとなるさ」","モモが、ヨルの手をにぎった。「名まえ、さがしにこよう。なんどでも、こよう」","**GOOD END：とおくのあさ**——名まえは、またさがせばいい"],"c":[{"t":"タイトルにもどる","to":0}],"end":"GOOD"},"109":{"id":109,"ch":3,"n":"あさのかね","i":"🌄","p":["「アサ！」——よびかけは、しずかないただきに、すいこまれていった。しん、としている。なにも、おこらない。ひとこきゅう。ふたこきゅう。ランタンのホシが、ふっと、きえそうになって——","ごぉー……ん。つりがねが、ひとりでに、なった。だれもさわっていないのに。その音は、ながいねむりからめざめたひとの、はじめてのひといきに似ていた。つづいて、谷のほうから、こどもの鐘たちが、いっせいにこたえる。ごぉん、ごぉん、ごぉん——！","空のはしから、金いろのひかりがあふれだす。灰は、ひかりのなかで、ゆきのようにとけていった。「……あさだ」モモがつぶやいた。「ヨル、あさだよ！」その目は、もう、ヨルをまっすぐに見ていた。なにもかも、おもいだした目だった。","じいさまは、あさやけのなかで、しずかにないていた。「アサ、アサ、すまなかったのう。……おかえり」","**TRUE END：あさのかね**——ながいよるの、おわり"],"c":[{"t":"おまけをよむ","to":110},{"t":"タイトルにもどる","to":0}],"end":"TRUE"},"110":{"id":110,"ch":3,"n":"おまけ・灰のてちょう・3","i":"📖","p":["——のちに、しずかの谷のゆうびん局でみつかった、ふるいてちょうの、さいごのページ。","『鐘の山の鐘つきは、あさごとに、鐘の名をよぶ。「アサ、おはよう」と。名をよばれた鐘は、うれしそうになる。だから、あなたも、たいせつなひとの名まえを、ときどき、こえにだしてよんであげてください。名まえは、ともしび。よばれるたびに、あたたかくともるものだから。』","てちょうのさいごには、あたらしい字で、こうそえてあったという。『ヨル。モモ。ホシ。カネ。アサ。——みんな、わたしのともしび』","**おまけ：灰のてちょう・3**"],"c":[{"t":"タイトルにもどる","to":0}],"end":"OMAKE"}};
const ITEMS = {"lantern":{"n":"ホシのランタン","i":"🏮"},"k1":{"n":"鐘のかけら・いち","i":"🔔"},"k2":{"n":"鐘のかけら・に","i":"🌟"},"k3":{"n":"鐘のかけら・さん","i":"✨"},"techo":{"n":"なまえのてちょう","i":"📔"},"mizu":{"n":"しみずのびん","i":"💧"},"kurumi":{"n":"くるみのふくろ","i":"🌰"},"himo":{"n":"ほしいろのひも","i":"🧵"},"cha":{"n":"ほしのお茶のつつみ","i":"🍵"},"kaze":{"n":"風のうたのきれはし","i":"🍃"},"asa":{"n":"てちょうのあたらしい名まえ","i":"⭐"},"hane":{"n":"おおきなつばさのはね","i":"🪶"}};
const CHNAMES = {1:"\u7b2c\u4e00\u7ae0\u3000\u307e\u3061\u3068\u591c\u884c\u5217\u8eca",2:"\u7b2c\u4e8c\u7ae0\u3000\u3057\u305a\u304b\u306e\u8c37",3:"\u7b2c\u4e09\u7ae0\u3000\u9418\u306e\u5c71"};
const CP = [1,34,64,91];
const BADGES = [["TRUE","TRUE END"],["GOOD","GOOD END"],["END","END"],["BAD","BAD END"],["OMAKE","\u304a\u307e\u3051"]];
const SAVEKEY="yoru2z_save1", FOUNDKEY="yoru2z_found";
const app = document.getElementById("app");
let S = null; // {at,waza,genki,un,mw,mg,mu,items,cp}
let rerolled = false;
function d6(){ return 1 + Math.floor(Math.random()*6); }
function dface(v){ return "\u2680\u2681\u2682\u2683\u2684\u2685"[v-1]; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function found(){ try { return JSON.parse(localStorage.getItem(FOUNDKEY)||"[]"); } catch(e){ return []; } }
function markEnd(k){ const f=found(); if(!f.includes(k)){ f.push(k); try{ localStorage.setItem(FOUNDKEY, JSON.stringify(f)); }catch(e){} } }
function saveGame(){ try{ localStorage.setItem(SAVEKEY, JSON.stringify(S)); }catch(e){} }
function loadGame(){ try{ return JSON.parse(localStorage.getItem(SAVEKEY)||"null"); }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVEKEY); }catch(e){} }
function has(id){ return S.items.includes(id); }
function reqOk(c){ return !c.req || c.req.every(has); }
function addItems(list, parts){ (list||[]).forEach(function(it){ if(!has(it)){ S.items.push(it); parts.push('<div class="gain">'+ITEMS[it].i+' \u300c'+ITEMS[it].n+'\u300d\u3092\u3066\u306b\u3044\u308c\u305f</div>'); } }); }
function applyFx(fx, parts){ if(!fx) return; const L={waza:"\u308f\u3056",genki:"\u3052\u3093\u304d",un:"\u3046\u3093"}; const notes=[];
  ["waza","genki","un"].forEach(function(k){ if(fx[k]){ S[k]+=fx[k]; const cap={waza:"mw",genki:"mg",un:"mu"}[k]; if(S[k]>S[cap]) S[k]=S[cap]; notes.push(L[k]+(fx[k]>0?" +":" ")+fx[k]); } });
  if(notes.length) parts.push('<div class="fxnote">'+notes.join("\u3000/\u3000")+'</div>');
}
function statsBar(){
  return '<div class="stats">'+
    ''+
    '<span class="st">\u2764\ufe0f \u3052\u3093\u304d <b>'+S.genki+'</b><span style="color:var(--sub)">/'+S.mg+'</span></span>'+
    '<span class="st">\u2b50 \u3046\u3093 <b>'+S.un+'</b></span>'+
    '<button class="bag" onclick="toggleBag()">\ud83c\udf92 '+S.items.length+'</button></div>'+
    '<div class="baglist" id="baglist" style="display:none">'+(S.items.length? S.items.map(function(i){return ITEMS[i].i+" "+ITEMS[i].n;}).join("\u3000\u30fb\u3000") : "\uff08\u306a\u306b\u3082\u3082\u3063\u3066\u3044\u306a\u3044\uff09")+'</div>';
}
function toggleBag(){ const b=document.getElementById("baglist"); if(b) b.style.display = b.style.display==="none" ? "block" : "none"; }
function topbar(s){ return '<div class="topbar"><span>\u30e8\u30eb\u3068\u661f\u306e\u9418\u3000\u2014\u3000'+CHNAMES[s.ch]+'</span><button id="bgmbtn" onclick="bgmToggle()">'+((typeof bgmOn==="undefined"||bgmOn)?'\u266a':'\u266a\u00d7')+'</button><button onclick="showTitle()">\u30bf\u30a4\u30c8\u30eb\u3078</button></div>'; }
function choiceButtons(s){
  let h='';
  s.c.forEach(function(c,idx){
    if(!reqOk(c)) return;
    const cls = c.req||c.use ? ' class="item"' : (c.luck ? ' class="luckbtn"' : '');
    const label = (c.luck ? '\u2b50 ' : '\u25b8 ') + esc(c.t) + (c.use ? '\u3000\uff08'+ITEMS[c.use].n+'\u3092\u3064\u304b\u3046\uff09' : '') + (c.luck ? '\u3000\uff08\u3046\u3093\u3060\u3081\u3057\uff09' : '');
    h += '<button'+cls+' onclick="pick('+s.id+','+idx+')">'+label+'</button>';
  });
  return h;
}
function pick(sid, idx){
  const s=SCENES[String(sid)], c=s.c[idx];
  if(c.use){ const i=S.items.indexOf(c.use); if(i>=0) S.items.splice(i,1); }
  if(c.get){ c.get.forEach(function(it){ if(!has(it)) S.items.push(it); }); }
  if(c.fx){ ["waza","genki","un"].forEach(function(k){ if(c.fx[k]){ S[k]+=c.fx[k]; const cap={waza:"mw",genki:"mg",un:"mu"}[k]; if(S[k]>S[cap]) S[k]=S[cap]; } }); }
  if(S.genki<=0){ gameOver(); return; }
  if(c.luck){ luckTest(c); return; }
  goTo(c.to);
}
function luckTest(c){
  const a=d6(), b=d6(), ok = (a+b) <= S.un;
  S.un = Math.max(0, S.un-1);
  const area=document.getElementById("actions");
  area.innerHTML = '<div class="dicelog"><span class="dice">'+dface(a)+' '+dface(b)+'</span>\u3000'+(a+b)+' \u2192 <b class="'+(ok?'ok':'ng')+'">'+(ok?'\u3046\u3093\u304c\u3088\u304b\u3063\u305f\uff01':'\u3046\u3093\u304c\u308f\u308b\u304b\u3063\u305f\u2026')+'</b>\u3000<span style="color:var(--sub);font-size:13px">\uff08\u3046\u3093 \u30fc1\uff09</span></div>'+
    '<div class="choices"><button onclick="goTo('+(ok?c.luck[0]:c.luck[1])+')">\u25b8 \u3064\u3065\u304d</button></div>';
  saveGame();
}
let B=null;
function battleStart(sid){
  const s=SCENES[String(sid)];
  B={e:Object.assign({},s.b), log:""};
  battleRound(sid);
}
function battleRound(sid){
  const s=SCENES[String(sid)];
  const p1=d6(),p2=d6(),e1=d6(),e2=d6();
  const pa=p1+p2, ea=e1+e2;
  let line='\u30e8\u30eb <span class="dice">'+dface(p1)+dface(p2)+'</span>=<b>'+pa+'</b>\u3000'+esc(B.e.n)+' <span class="dice">'+dface(e1)+dface(e2)+'</span>=<b>'+ea+'</b><br>';
  if(pa>ea){ B.e.genki-=2; line+='<b class="ok">\u30e8\u30eb\u306e\u3044\u3061\u3052\u304d\uff01</b>\uff08\u3042\u3044\u3066\u306e\u3052\u3093\u304d \u30fc2\uff09'; }
  else if(ea>pa){ S.genki-=1; line+='<b class="ng">\u3084\u3089\u308c\u305f\u2026\uff01</b>\uff08\u3052\u3093\u304d \u30fc1\uff09'; }
  else { line+='\u304a\u305f\u304c\u3044\u306b\u307f\u304d\u308a\u3042\u3063\u305f\u2026\uff08\u5f15\u304d\u5206\u3051\uff09'; }
  B.log = line;
  if(S.genki<=0){ gameOver(); return; }
  renderBattle(sid);
  saveGame();
}
function renderBattle(sid){
  const s=SCENES[String(sid)];
  const st=document.getElementById("statswrap"); if(st) st.innerHTML=statsBar();
  const area=document.getElementById("actions");
  let h='<div class="enemy"><div class="en">'+B.e.i+' '+esc(B.e.n)+'</div><div class="es">\u2764\ufe0f \u3052\u3093\u304d '+Math.max(0,B.e.genki)+'</div></div>';
  if(B.log) h+='<div class="dicelog">'+B.log+'</div>';
  if(B.e.genki<=0){ h+='<div class="gain">'+esc(B.e.n)+'\u306b \u304b\u3063\u305f\uff01</div><div class="choices"><button onclick="B=null;goTo('+s.b.to+')">\u25b8 \u3064\u3065\u304d</button></div>'; }
  else { h+='<div class="choices"><button onclick="battleRound('+sid+')">\u2694\ufe0f \u305f\u305f\u304b\u3046\uff081\u30e9\u30a6\u30f3\u30c9\uff09</button></div>'; }
  area.innerHTML=h;
}
function gameOver(){
  B=null;
  app.innerHTML = '<div class="title"><div class="candle">\ud83c\udf2b\ufe0f</div><h1 style="font-size:24px">\u30e8\u30eb\u306f\u3001\u3057\u305a\u304b\u306b\u306a\u3063\u3066\u3057\u307e\u3063\u305f\u2026</h1>'+
    '<p class="sub">\u3067\u3082\u3001\u3060\u3044\u3058\u3087\u3046\u3076\u3002\u3057\u305a\u304b\u306f\u3001\u304a\u308f\u308a\u3067\u306f\u306a\u3044\u3002<br>\u3069\u3053\u304b\u3067\u3001\u3042\u305f\u305f\u304b\u3044\u97f3\u304c\u3059\u308b\u2014\u2014</p>'+
    '<button class="start" onclick="restoreCp()">\u25b6 \u3053\u306e\u7ae0\u306e\u306f\u3058\u3081\u304b\u3089</button>'+
    '<button class="cont" onclick="showTitle()">\u30bf\u30a4\u30c8\u30eb\u3078</button></div>';
  window.scrollTo(0,0);
}
function restoreCp(){ if(S && S.cp){ S = JSON.parse(JSON.stringify(S.cp)); S.cp = JSON.parse(JSON.stringify(S)); goTo(S.at, true); } else { showTitle(); } }
function badgesHtml(){ const f=found(); return '<div class="badges">'+BADGES.map(function(b){ const got=f.includes(b[0]); return '<span class="badge'+(got?' got':'')+'">'+(got?'\u2605 '+b[1]:'\uff1f\uff1f\uff1f')+'</span>'; }).join("")+'</div>'; }
function showTitle(){
  if(S) saveGame();
  const sv=loadGame();
  app.innerHTML = '<div class="title"><div class="candle">\ud83d\udd14</div>'+
    '<div class="ser">\u30e8\u30eb\u3068\u7070\u306e\u3046\u305f\u3000\u7b2c\u4e8c\u4f5c</div>'+
    '<h1>\u30e8\u30eb\u3068\u661f\u306e\u9418</h1>'+
    '<p class="sub">\u5317\u306e\u8c37\u3067\u3001\u3081\u3056\u307e\u3057\u306e\u9418\u304c\u308f\u308c\u305f\u3002<br>\u6751\u306f\u3001\u6751\u3054\u3068\u306d\u3080\u3063\u305f\u307e\u307e\u2014\u2014</p>'+
    '<button class="start" onclick="charGen()">\u25b6 \u306f\u3058\u3081\u304b\u3089</button>'+
    (sv && sv.at ? '<button class="cont" onclick="contGame()">\u3064\u3065\u304d\u304b\u3089\uff08'+CHNAMES[(SCENES[String(sv.at)]||{ch:1}).ch]+'\uff09</button>' : '')+
    badgesHtml()+
    '<p class="note">\u7b2c\u4e09\u7ae0\u7de8\u30fb\u5168110\u5834\u9762\u3067\u72ec\u7acb\u5b8c\u7d50\uff0f\u30b2\u30fc\u30e0\u30d6\u30c3\u30af\u5f0f\uff08\u3052\u3093\u304d\u30fb\u3046\u3093\uff09</p></div>';
  window.scrollTo(0,0);
}
function contGame(){ const sv=loadGame(); if(sv){ S=sv; rerolled=true; goTo(S.at, true); } }
function charGen(){
  const g=d6()+6, u=d6()+6;
  S={at:1, waza:0, genki:Math.max(1,g-2), un:u, mw:0, mg:g, mu:u, items:["lantern","k1","k2"], cp:null};
  app.innerHTML='<div class="cgen"><h2>\u3053\u3093\u304b\u3044\u306e\u30e8\u30eb</h2>'+
    '<div class="rolls">'+
    ''+
    '<div class="r"><div class="lbl">\u2764\ufe0f \u3052\u3093\u304d</div><div class="val">'+g+'</div><div class="lbl">1\u500b+6</div></div>'+
    '<div class="r"><div class="lbl">\u2b50 \u3046\u3093</div><div class="val">'+u+'</div><div class="lbl">1\u500b+6</div></div></div>'+
    '<p class="hint">\u30b5\u30a4\u30b3\u30ed\u3067\u304d\u307e\u3063\u305f\u3001\u304d\u3087\u3046\u306e\u30e8\u30eb\u3067\u3059\u3002\u3082\u3061\u3082\u306e\uff1a\ud83c\udfee \u30db\u30b7\u306e\u30e9\u30f3\u30bf\u30f3</p>'+
    '<div class="choices"><button onclick="startGame()">\u25b8 \u3053\u306e\u30e8\u30eb\u3067\u3057\u3085\u3063\u3071\u3064\uff01</button>'+
    (rerolled? '' : '<button onclick="rerolled=true;charGen()">\ud83c\udfb2 \u3075\u308a\u306a\u304a\u3059\uff08\u4e00\u5ea6\u3060\u3051\uff09</button>')+
    '</div></div>';
  window.scrollTo(0,0);
}
function startGame(){ rerolled=true; goTo(1); }
function goTo(id, noFx){
  if(id===0){ showTitle(); return; }
  const s=SCENES[String(id)];
  if(!s){ showTitle(); return; }
  S.at=id; B=null;
  const parts=[];
  if(!noFx){ addItems(s.get, parts); applyFx(s.fx, parts); }
  if(S.genki<=0){ saveGame(); gameOver(); return; }
  if(CP.includes(id)){ const snap=JSON.parse(JSON.stringify(S)); snap.cp=null; S.cp=snap; }
  if(s.end){ markEnd(s.end==='OMAKE'?'OMAKE':s.end); if(s.end!=='OMAKE') clearSave(); }
  let h=topbar(s)+'<div id="statswrap">'+statsBar()+'</div>';
  h+='<div class="scene"><div class="scenehead"><span class="no">'+String(id).padStart(2,"0")+'</span><h2>'+s.i+' '+esc(s.n)+'</h2></div><div class="paras">';
  let banner='';
  s.p.forEach(function(p){
    const m=p.match(/^\*\*([^*]+)\*\*(.*)$/);
    if(s.end && m && /(END|GAME OVER|\u304a\u307e\u3051)/.test(m[1])){ banner='<div class="banner"><div class="big">'+esc(m[1])+'</div>'+(m[2]?'<div class="es" style="color:var(--sub);font-size:13px;margin-top:4px">'+esc(m[2])+'</div>':'')+'</div>'; }
    else h+='<p>'+md(p)+'</p>';
  });
  h+='</div>'+parts.join("")+banner+'<div id="actions">';
  if(s.b){ h+='<div class="enemy"><div class="en">'+s.b.i+' '+esc(s.b.n)+'</div><div class="es">\u2764\ufe0f \u3052\u3093\u304d '+s.b.genki+'</div></div>'; }
  if(!s.end && (s.c.length>1 || s.b)) h+='<div class="ask">\u3069\u3046\u3059\u308b\uff1f</div>';
  else if(!s.end && s.c.length===1) h+='<div class="ask">\u3064\u304e\u3078</div>';
  h+='<div class="choices">'+choiceButtons(s);
  if(s.b) h+='<button onclick="battleStart('+id+')">\u2694\ufe0f \u305f\u305f\u304b\u3046</button>';
  h+='</div></div></div>';
  app.innerHTML=h;
  if(!s.end) saveGame();
  window.scrollTo(0,0);
}
(function(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("ash"), cx=cv.getContext("2d");
  let W,H,ps;
  function reset(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight;
    ps=Array.from({length:36},function(){ return {x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*1.6,v:.25+Math.random()*.55,d:(Math.random()-.5)*.3}; }); }
  reset(); window.addEventListener("resize",reset);
  (function tick(){ cx.clearRect(0,0,W,H); cx.fillStyle="rgba(255,255,255,.22)";
    ps.forEach(function(p){ cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); p.y+=p.v; p.x+=p.d; if(p.y>H+4){p.y=-4;p.x=Math.random()*W;} });
    requestAnimationFrame(tick); })();
})();
const hm=location.hash.match(/scene=(\d+)/);
if(hm){ S={at:1,waza:0,genki:8,un:8,mw:0,mg:10,mu:8,items:["lantern","k1","k2","k3","techo","mizu","kurumi","himo","cha","kaze","asa","hane"],cp:null}; rerolled=true; goTo(parseInt(hm[1],10)); }
else { showTitle(); }
</script>
<script>
var bgmAC=null,bgmMaster=null,bgmTimer=null,bgmOn=true;
try{bgmOn=(localStorage.getItem("yoru2z_bgm")!=="off");}catch(e){}
var BGMNOTES=[220,261.63,293.66,329.63,392,440,523.25];
function bgmInit(){if(bgmAC)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;bgmAC=new C();bgmMaster=bgmAC.createGain();bgmMaster.gain.value=0.05;bgmMaster.connect(bgmAC.destination);var d=bgmAC.createOscillator(),dg=bgmAC.createGain();d.type="triangle";d.frequency.value=55;dg.gain.value=0.01;d.connect(dg);dg.connect(bgmAC.destination);d.start();}
function bgmNote(){if(!bgmOn||!bgmAC)return;if(Math.random()<0.22)return;var t=bgmAC.currentTime,f=BGMNOTES[Math.floor(Math.random()*BGMNOTES.length)];var o=bgmAC.createOscillator(),g=bgmAC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.5,t+0.9);g.gain.linearRampToValueAtTime(0,t+3.8);o.connect(g);g.connect(bgmMaster);o.start(t);o.stop(t+4);if(Math.random()<0.35){var o2=bgmAC.createOscillator(),g2=bgmAC.createGain();o2.type="sine";o2.frequency.value=f*1.5;g2.gain.setValueAtTime(0,t+0.5);g2.gain.linearRampToValueAtTime(0.2,t+1.5);g2.gain.linearRampToValueAtTime(0,t+3.6);o2.connect(g2);g2.connect(bgmMaster);o2.start(t);o2.stop(t+4);}}}
function bgmStart(){if(!bgmOn)return;bgmInit();if(!bgmAC)return;if(bgmAC.state==="suspended")bgmAC.resume();if(!bgmTimer){bgmNote();bgmTimer=setInterval(bgmNote,2400);}}
function bgmStop(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}if(bgmAC){bgmAC.suspend();}}
function bgmToggle(){bgmOn=!bgmOn;try{localStorage.setItem("yoru2z_bgm",bgmOn?"on":"off");}catch(e){}if(bgmOn){bgmStart();}else{bgmStop();}var b=document.getElementById("bgmbtn");if(b){b.textContent=bgmOn?"\u266a":"\u266a\u00d7";}}
document.addEventListener("pointerdown",function(){if(bgmOn)bgmStart();});
</script>
