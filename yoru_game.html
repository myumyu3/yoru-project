<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヨルと灰のうた</title>
<style>
:root{--bg:#191919;--surface:#202020;--raised:#2b2b2a;--text:#ffffff;--sub:rgba(255,255,255,.65);--border:rgba(255,255,255,.16);--accent:#5E9FE8;--gold:#EAC26B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;line-height:1.9;font-size:16px;-webkit-font-smoothing:antialiased}
#ash{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:12px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 10px;color:var(--sub);font-size:13px}
.topbar .game{letter-spacing:.06em}
.topbar button{background:none;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:8px 14px;min-height:40px;font-size:13px;cursor:pointer;font-family:inherit}
.topbar button:hover{border-color:var(--accent);color:var(--text)}
.scene{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 20px 24px;animation:fade .45s ease}
.scenehead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:4px}
.scenehead .no{font-size:13px;color:var(--sub);white-space:nowrap}
.scenehead h2{font-size:20px;line-height:1.5}
.paras p{margin:14px 0;color:rgba(255,255,255,.92)}
.banner{margin:18px 0 4px;padding:14px 16px;border-radius:10px;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.04)}
.banner .big{font-size:19px;font-weight:700;letter-spacing:.08em}
.banner .small{font-size:13px;color:var(--sub);margin-top:4px}
.ask{margin:22px 0 10px;color:var(--sub);font-size:13px;letter-spacing:.18em}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{display:block;width:100%;text-align:left;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:16px;min-height:48px;line-height:1.6;cursor:pointer;font-family:inherit;transition:border-color .15s}
.choices button:hover,.choices button:focus-visible{border-color:var(--accent)}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 8px;animation:fade .6s ease}
.title .candle{font-size:40px;margin-bottom:12px}
.title .keyart{width:100%;max-width:540px;border-radius:12px;margin-bottom:20px;border:1px solid var(--border);display:block;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.title h1{font-size:30px;letter-spacing:.12em;margin-bottom:10px}
.title .sub{color:var(--sub);font-size:15px;margin-bottom:28px}
.title .start{background:rgba(94,159,232,.14);border:1px solid var(--accent);color:var(--text);font-size:17px;font-family:inherit;border-radius:10px;padding:13px 44px;min-height:50px;cursor:pointer;letter-spacing:.1em}
.title .start:hover{background:rgba(94,159,232,.24)}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:30px;max-width:420px}
.badge{border:1px solid var(--border);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--sub);background:var(--surface)}
.badge.got{color:var(--gold);border-color:rgba(234,194,107,.45)}
.title .note{color:var(--sub);font-size:12px;margin-top:18px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.scene,.title{animation:none}}
@media (max-width:420px){#app{padding:10px 12px 32px}.scene{padding:16px 14px 20px}.title h1{font-size:26px}}
.scene-illust{width:100%;border-radius:10px;margin:12px 0 4px;display:block;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
<canvas id="ash" aria-hidden="true"></canvas>
<main id="app"></main>
<script>
"use strict";
const SCENES = {"1": {"id": 1, "name": "ふるい部屋", "icon": "🌫️", "paras": ["あさ。まどのそとが、しずかに白い。灰は、こんやも降ったらしい。", "テーブルの上に、モモの字。『もりへ いきます。さがさないで。 モモ』", "さがさないで、と書くひとは、たいてい、さがしてほしいのだ。ヨルは小さなほうきを手に取った。"], "choices": [["部屋を出て、通りへ", 2], ["手紙のうらを見る", 3]], "end": false}, "2": {"id": 2, "name": "まちの通り", "icon": "🌫️", "paras": ["通りには誰もいない。屋根も、看板も、うっすら白い。", "灰は、ふれてもすぐには何ともない。でも、浴びつづけたものは、少しずつ「しずか」になる。先週、パンやのおじさんが止まった。", "武器屋のクゥの店には、まだ灯りがついている。"], "choices": [["クゥの店による", 4], ["まっすぐ、まちの門へ", 6]], "end": false}, "3": {"id": 3, "name": "置き手紙のうら", "icon": "🌫️", "paras": ["うらに、えんぴつのうすい線。地図の切れはしだ。", "森のふち、白いポストのところに、しるしがついている。"], "choices": [["部屋を出て、通りへ", 2]], "end": false}, "4": {"id": 4, "name": "クゥの店", "icon": "🌫️", "paras": ["トカゲのクゥが、しっぽで棚をふきながら言う。『モモなら、きのう鈴を買っていった。おまえも持っていきな』", "小さな銀の鈴。ふると、澄んだ音がする。", "『ながいものは、音がきらいだ。……いや、きらいっていうか』クゥは、そこで口をつぐんだ。"], "choices": [["お礼を言って、まちの門へ", 6], ["灰のことを聞く", 5]], "end": false}, "5": {"id": 5, "name": "灰のはなし", "icon": "🌫️", "paras": ["『灰はな』クゥは声を落とした。『置いていかれた声で、できてるんだそうだ』", "『さみしい声のところに、集まる。だから――ひとりで泣くなよ』"], "choices": [["うなずいて、まちの門へ", 6]], "end": false}, "6": {"id": 6, "name": "まちの門", "icon": "🌫️", "paras": ["門番のじいさまが、灰よけの傘の下で言う。『森のふちの白いポストまでなら、まだ道がある。その先は、しらん』", "『帰ってこいよ。ばんごはんの時間までに』じいさまは、わらった。"], "choices": [["森のふちへ", 7]], "end": false}, "7": {"id": 7, "name": "白いポスト", "icon": "🌲", "paras": ["白いポストが、灰の中にぽつんと立っている。だれも手紙なんか出さないのに。", "ポストの上に、見おぼえのある帽子。モモのだ。"], "choices": [["帽子をつかんで、森へ", 9], ["ポストの中をのぞく", 8]], "end": false}, "8": {"id": 8, "name": "ポストの底", "icon": "🌲", "paras": ["底に、古い切符が一枚。『はいえき ゆき』と読める。", "はいえき。廃駅。森のおくに、むかし駅があったって、じいさまが言っていた。"], "choices": [["切符をポケットに入れて、森へ", 9]], "end": false}, "9": {"id": 9, "name": "灰の森・入口", "icon": "🌲", "paras": ["木が、ぜんぶ白い。葉のかたちのまま、灰になって止まっている。", "足もとに、あしあとが二人分。とちゅうから、一人分になっている。", "川の音も、とおくに聞こえる。"], "choices": [["あしあとを追う", 10], ["川の音のほうへ", 11]], "end": false}, "10": {"id": 10, "name": "あしあとの先", "icon": "🌲", "paras": ["あしあとが、ふっと消えた。かわりに、なにか長いものを引きずったあとが、木々のあいだへつづいている。", "とおくで、白い影が、ゆっくりうねった。ながい。とても、ながい。"], "choices": [["木のうろに、かくれる", 12], ["鈴を鳴らしてみる", 13]], "end": false}, "11": {"id": 11, "name": "白い川", "icon": "🌲", "paras": ["川が、灰で白くにごって流れている。わたし石が、とびとびに並ぶ。", "対岸に、小さな祠が見えた。灰をかぶって、まっしろだ。"], "choices": [["わたし石をわたる", 14], ["先に祠に、おまいりする", 15]], "end": false}, "12": {"id": 12, "name": "木のうろ", "icon": "🌲", "paras": ["うろの中で、息をころす。ずる、ずる、と音が通りすぎていく。", "音が消えたあと、うろの奥に古いカンテラを見つけた。まだ、ともる。"], "choices": [["カンテラをさげて、森のおくへ", 16]], "end": false}, "13": {"id": 13, "name": "鈴の音", "icon": "🌲", "paras": ["りん、と鳴らす。白い影がびくりと止まり、身をよじって、森のおくへ消えた。", "あとには、うろこが一枚。さわると、すこしあたたかい。……こわいものの体温じゃ、ない気がした。"], "choices": [["うろこをひろって、森のおくへ", 16]], "end": false}, "14": {"id": 14, "name": "わたし石", "icon": "🌲", "paras": ["三つめの石が、ぐらりとかたむいた。白い水が、すぐそこ。"], "choices": [["えいっと、とぶ", 16], ["ひきかえして、祠へ", 15]], "end": false}, "15": {"id": 15, "name": "小さな祠", "icon": "🌲", "paras": ["祠の中に、小さな石像。だれかに似ている気がするけれど、思い出せない。", "手を合わせると、むねのおくが、ぽ、とあたたかくなった。"], "choices": [["森のおくへ", 16]], "end": false}, "16": {"id": 16, "name": "灰の線路", "icon": "🚃", "paras": ["森のおくに、線路が出た。灰に半分うもれて、それでもまっすぐ、のびている。", "かたむいた標識に、うすく読める。『はいえき →』"], "choices": [["線路をたどる", 17]], "end": false}, "17": {"id": 17, "name": "廃駅ホーム", "icon": "🚃", "paras": ["だれもいないホーム。時計は止まり、ベンチだけが行儀よく並んでいる。", "伝言板に、灰で書いた文字。『モモ ここで やすんだ』——まちがいない、あの子の字だ。"], "choices": [["駅舎の中をしらべる", 18], ["線路の先のトンネルへ", 19]], "end": false}, "18": {"id": 18, "name": "駅舎と売店あと", "icon": "🚃", "paras": ["待合室のストーブに、燃えのこりの火。まだ、あたたかい。近くにいる。", "売店のあとに、菓子の包み紙がひとつ。モモの好きなやつだ。ちゃんと食べてる。えらい。", "壁の路線図。この先は『ちかすいろ』をとおって、『とう』へ。"], "choices": [["地下水路の鉄扉へ", 20], ["ホームにもどる", 19]], "end": false}, "19": {"id": 19, "name": "線路のトンネル", "icon": "🚃", "paras": ["トンネルの口から、つめたい風。それから――かすかに、歌。", "だれの歌だろう。ちいさくて、ふるくて、すこし、かなしい。"], "choices": [["入ってみる", 21], ["やめて、駅舎をしらべる", 18]], "end": false}, "20": {"id": 20, "name": "地下水路の鉄扉", "icon": "🚃", "paras": ["線路のわきの階段を下りると、鉄の扉。『関係者以外 立入禁止』。", "すきまから、あかりが漏れている。中に、だれかいる。"], "choices": [["ノックする", 22], ["すきまから、そっと入る", 23]], "end": false}, "21": {"id": 21, "name": "トンネルの闇", "icon": "🚃", "paras": ["歌が、やんだ。", "くらやみに、目が、ならぶ。ひとつ、ふたつ……たくさん。ながいものだ。"], "choices": [["走って、ホームへもどる", 17], ["ありったけの音をたてて、立ち向かう", 24]], "end": false}, "22": {"id": 22, "name": "カイロさん", "icon": "🏮", "paras": ["扉をあけたのは、大きな大きな鎧のひと。中は見えない。", "『とおりたいのか。地下はいま、灰がこい』こもった、やさしい声だった。『しごとを手つだうなら、とおしてやる』"], "choices": [["手つだう", 25], ["モモのことを話す", 26]], "end": false}, "23": {"id": 23, "name": "すきまから", "icon": "🏮", "paras": ["そっと入ったつもりが、カンテラの警報がからんからんと鳴った。", "大きな鎧のひとが、ぬっと立ちふさがる。『……こら』"], "choices": [["ごめんなさいをして、わけを話す", 26], ["走って、水路へにげる", 27]], "end": false}, "24": {"id": 24, "name": "立ち向かう", "icon": "🏮", "paras": ["ありったけの音と、ひかり。鈴でも、カンテラでも、じぶんの声でもいい。", "ながいものは、ヨルをじっと見た。それから――泣くような声をひとつ、のこして、闇のおくへ帰っていった。", "手のひらに、灰がひとひら落ちて、とけた。あたたかかった。"], "choices": [["トンネルのおくへ", 28]], "end": false}, "25": {"id": 25, "name": "おしごと", "icon": "🏮", "paras": ["灰のふきだまりを、ふたりで掃く。鎧のひとは、カイロさんという名前だった。", "『ちいさいのに、えらいな』カイロさんは通行証をくれた。『地下で歌がきこえても、ついていくなよ』"], "choices": [["地下水路へ", 27]], "end": false}, "26": {"id": 26, "name": "わけを話す", "icon": "🏮", "paras": ["モモのこと。灰のこと。カイロさんは、しばらくだまっていた。", "『灰はな、おいていかれた声で、できてるんだ』それから、通行証をくれた。『……むかし、おれも、さがしたことがある』"], "choices": [["地下水路へ", 27]], "end": false}, "27": {"id": 27, "name": "地下水路", "icon": "🏮", "paras": ["白い水が、音もなく流れる。天井のパイプから、しずくが、ぽつん。", "道がふたつ。ひくく水の音がするほうと、風がのぼっていくほう。"], "choices": [["水の音のほうへ", 29], ["風のほうへ", 30]], "end": false}, "28": {"id": 28, "name": "くずれ穴", "icon": "🏮", "paras": ["トンネルのかべが、くずれていた。穴のむこうは――うわっ。", "ずるん、とすべって、ヨルは地下水路に落っこちた。いたくない。灰が、ふとんみたいだった。"], "choices": [["立ちあがって、進む", 27]], "end": false}, "29": {"id": 29, "name": "地底の湖", "icon": "🌊", "paras": ["ひらけた闇に、まるい湖。水は白く、鏡みたいにしずかだ。", "岸に小舟がひとつ。舟の底に、鈴が落ちている。……モモの鈴だ。おそろいの。"], "choices": [["小舟をこぐ", 31], ["岸づたいに、まわる", 32]], "end": false}, "30": {"id": 30, "name": "らせん階段", "icon": "🌊", "paras": ["風ののぼっていく先に、らせん階段。かべに、だれかの落書き。", "『うえは とう。とうは だめ。だめって いったのに』"], "choices": [["のぼる", 33], ["水路にもどる", 27]], "end": false}, "31": {"id": 31, "name": "小舟", "icon": "🌊", "paras": ["湖のまんなかで、水がもり上がった。白い、ながいものたち。", "にげ場はない。……でも、舟は、しずまなかった。ながいものは、そっと舟を押して、対岸まで運んでくれた。", "『……ありがとう』言うと、水の下で、りん、と音がした気がした。"], "choices": [["対岸の階段へ", 33]], "end": false}, "32": {"id": 32, "name": "くずれ桟橋", "icon": "🌊", "paras": ["岸づたいの桟橋は、板がところどころ、ぬけている。下は白い水。"], "choices": [["しんちょうに、ゆっくり進む", 33], ["一気に、走りぬける", 54]], "end": false}, "33": {"id": 33, "name": "塔の下", "icon": "🌊", "paras": ["階段をのぼりきると、吹きぬけの底に出た。見あげると、はるか上まで、塔。", "灰が――下から上へ、さかさまに、降っていた。"], "choices": [["塔をのぼる", 34]], "end": false}, "34": {"id": 34, "name": "塔・一階", "icon": "🗼", "paras": ["灰のじゅうたんに、小さなあしあと。モモのだ。まよいなく、おくへつづいている。", "あしあとの先に、小さな部屋。正面には、大きな大きな階段。"], "choices": [["あしあとをたどって、小部屋へ", 35], ["大階段をのぼる", 36]], "end": false}, "35": {"id": 35, "name": "あしあとの小部屋", "icon": "🗼", "paras": ["毛布と、食べかけのお菓子。ここで休んだんだ。", "かべに、手紙がはってあった。『ヨルへ。きちゃだめ。わたし、灰によばれてるの。だいじょうぶ、こわくないよ』", "こわくないよ、と書くひとは、たいてい、こわいのだ。"], "choices": [["大階段へ", 36]], "end": false}, "36": {"id": 36, "name": "大階段と灰の像", "icon": "🗼", "paras": ["階段のわきに、灰の像がならんでいる。動物も、鳥も、ちいさいものも。", "みんな、だれかを待つかたちのまま、止まっている。"], "choices": [["見ないようにして、のぼる", 38], ["一体に、そっとふれる", 37]], "end": false}, "37": {"id": 37, "name": "像のささやき", "icon": "🗼", "paras": ["ふれた像の中で、ちいさな声がした。『わすれないで』", "手のひらに、あたたかい灰がのこった。にぎりしめて、のぼる。"], "choices": [["階段のうえへ", 38]], "end": false}, "38": {"id": 38, "name": "中層の窓", "icon": "🗼", "paras": ["窓のそとに、まちが小さく見えた。あそこに、じいさまがいて、クゥがいる。", "階段はまだつづく。とちゅうに、古い扉がひとつ。『としょしつ』と書いてある。"], "choices": [["のぼりつづける", 40], ["図書室に入る", 39]], "end": false}, "39": {"id": 39, "name": "図書室", "icon": "🗼", "paras": ["灰をかぶった本棚のあいだに、一冊だけ、灰のつもっていない絵本。", "『そらから きた ほしのこ』——むかし、空から小さな星の子がおちてきて、まちのみんなと暮らした。でも、みんなが先に年をとって、いなくなって、星の子の名前をよぶひとは、いなくなった。", "さいごのページに、名前が書いてある。……よめない。灰で、そこだけ、にじんでいる。"], "choices": [["絵本をそっともどして、上へ", 40]], "end": false}, "40": {"id": 40, "name": "白い廊下と鏡", "icon": "🗼", "paras": ["ながい廊下のとちゅうに、大きな鏡。", "鏡の中のヨルは、灰いろだった。うごかない。こっちを、見ている。"], "choices": [["鏡を、わる", 41], ["目をそらして、進む", 42]], "end": false}, "41": {"id": 41, "name": "割れた鏡", "icon": "🗼", "paras": ["がしゃん。破片のおくに、かくし階段があった。", "鏡の中のヨルは、われるまえ、ちょっとだけ、わらった気がする。"], "choices": [["かくし階段をのぼる", 44]], "end": false}, "42": {"id": 42, "name": "まわり道", "icon": "🗼", "paras": ["廊下は、いつまでもつづく。灰が、こくなっていく。", "足が、おもい。まぶたが、おもい。"], "choices": [["歌をうたいながら、歩く", 44], ["だまって、あるく", 43]], "end": false}, "43": {"id": 43, "name": "とまりかけ", "icon": "🗼", "paras": ["気づくと、立ちどまっていた。手の先が、白い。", "とおくで、声がする。『——ヨル！ ヨルってば！』"], "choices": [["へんじをする", 44], ["しずかで、いいや。目をとじる", 56]], "end": false}, "44": {"id": 44, "name": "上層", "icon": "🗼", "paras": ["灰が、雪みたいにまう。ひかりが、上からさしている。", "『……ヨル？』ふりむいた先に、モモがいた。"], "choices": [["かけよる", 45]], "end": false}, "45": {"id": 45, "name": "再会", "icon": "🗼", "paras": ["モモは、大きな白い柱のまえに立っていた。からだの半分が、うすく灰いろだ。", "『きちゃったんだ』モモはわらって、泣いた。『この塔の上にはね、灰の心臓があるの。ずっとひとりぼっちで、さみしくて、それで灰がふるの。だれかが、そばにいてあげないと、まちごと、ぜんぶ灰になる』"], "choices": [["「わたしが、かわる」と言う", 46], ["「いっしょに帰ろう」と言う", 47], ["灰の心臓に、話しかけてみる", 48]], "end": false}, "46": {"id": 46, "name": "身代わり", "icon": "🗼", "paras": ["『わたしがのこる。モモは帰って』", "柱のおくで、大きなものが、みじろぎした。『……きみは、だめ』ふるい、ふるい声だった。『きみには、のこしてきた声がある。ばんごはんの、やくそくがある』"], "choices": [["それでも、のこる", 53], ["モモの手をとって、心臓に向きあう", 48]], "end": false}, "47": {"id": 47, "name": "いっしょに帰ろう", "icon": "🗼", "paras": ["『帰れないよ』モモは首をふった。『わたしがはなれたら、みんな灰になっちゃう』"], "choices": [["灰の心臓に、話しかける", 48], ["むりやり、手をひく", 49]], "end": false}, "48": {"id": 48, "name": "灰の心臓", "icon": "🗼", "paras": ["柱のおくに、それはいた。大きくて、白くて、まるい――心臓というより、ねむっている、ちいさな生きものの、大きなかたまり。", "どく、どく、と鼓動がひびく。声がした。『……なまえを。わたしの、なまえを、よんで。もう、だれも、よんでくれない』"], "choices": [["名前を、さがす", 50], ["わからないまま「おはよう」と言ってみる", 51]], "end": false}, "49": {"id": 49, "name": "むりやり", "icon": "🗼", "paras": ["手をひくと、モモのうでが、さらさらと灰になりかけた。", "『やめて、ヨル。おねがい』"], "choices": [["手をはなして、心臓に向きあう", 48], ["それでも、ひっぱる", 57]], "end": false}, "50": {"id": 50, "name": "名前をさがす", "icon": "🗼", "paras": ["思い出せ。祠の石像。像のささやき。絵本の、にじんだ最後のページ。", "『そらから きた ほしのこ』——そうだ。かべを見て。塔のかべ、いちめんの、ふるい星の絵。", "灰（ハイ）じゃない。ほんとうの名前は——"], "choices": [["名前を、よぶ", 52]], "end": false}, "51": {"id": 51, "name": "「おはよう」", "icon": "🗼", "paras": ["鼓動が、とまどうように、はねた。『おはよう……おはよう。いい、ことば』", "『でも、なまえが、いい。なまえは、そのひとだけのだから』——かべの星の絵が、ちか、と光った気がした。"], "choices": [["かべの絵を、よく見る", 50]], "end": false}, "52": {"id": 52, "name": "よびごえ", "icon": "🗼", "paras": ["ヨルとモモは、いきをすって、いっしょによんだ。『——ホシ！』", "鼓動が、大きくひとつ、鳴った。塔じゅうの灰が、ひかりながら、上へ上へと帰っていく。", "白いかたまりのまんなかで、ちいさな星のこが、ゆっくり目をあけた。『……よんだ？』"], "choices": [["「よんだよ。いっしょに帰ろう」と手をつなぐ", 58], ["「あさまで、そばにいるよ」と言う", 59]], "end": false}, "53": {"id": 53, "name": "END・しずかな番人", "icon": "🕯️", "paras": ["ヨルは、塔にのこった。灰はやみ、まちには色がもどったという。", "モモは週にいちど、手紙とお菓子をとどけにくる。ふたりぶんのあしあとが、塔までの道に、ずっとついている。", "それは、ふしあわせな話ではない。でも——ほんとうの名前をよぶ物語は、べつの選択のさきにある。", "**END：しずかな番人**"], "choices": [["タイトルへ", 60]], "end": true}, "54": {"id": 54, "name": "GAME OVER・白い水", "icon": "💧", "paras": ["板が、ぬけた。白い水は、つめたくなかった。ただ、ねむたい。", "……気がつくと、廃駅のベンチにねかされていた。びしょぬれのヨルのよこに、うろこが一枚、おいてある。だれかが、ひきあげてくれたらしい。", "**GAME OVER：白い水**（でも、だれかのおかげで、つづきがある）"], "choices": [["廃駅から、やりなおす", 17], ["タイトルへ", 60]], "end": true}, "55": {"id": 55, "name": "おまけ・灰のメモ", "icon": "📖", "paras": ["◆ 灰……置いていかれた声のかたまり。さみしい声に集まる。ホシの目がさめたので、もう降らない。", "◆ ながいもの……灰の中でうまれた、ホシの夢のかけら。こわがられていたけれど、ほんとうは、しずむものを押しあげる係。", "◆ カイロさん……むかし、だれかをさがして塔にのぼったひと。鎧の中は、だれも見たことがない。", "◆ 祠の石像……いちばんはじめに、ホシと友だちになったひと、らしい。"], "choices": [["タイトルへ", 60]], "end": true}, "56": {"id": 56, "name": "GAME OVER・とまった時間", "icon": "🫧", "paras": ["目をとじると、しずかだった。とても、しずかだった。", "ヨルは、だれかを待つかたちの、ちいさな像になった。", "……でも、いつか、だれかが像にふれて、ささやくだろう。『わすれないで』と。そのとき、時間は、またうごきだす。", "**GAME OVER：とまった時間**"], "choices": [["タイトルへ", 60]], "end": true}, "57": {"id": 57, "name": "BAD END・ふたりぶんの灰", "icon": "🌑", "paras": ["はなさなかった。さいごまで、はなさなかった。", "塔の上には、手をつないだ、ちいさな像がふたつ。", "灰は、その日から、すこしだけ、あたたかくなったという。", "**BAD END：ふたりぶんの灰**"], "choices": [["タイトルへ", 60]], "end": true}, "58": {"id": 58, "name": "TRUE END・ほしのあさ", "icon": "⭐", "paras": ["三人で、ながいながい階段をおりた。ホシは、はじめての『おさんぽ』に、ずっとそわそわしていた。", "森を出るころ、あさになった。灰のない、はじめての朝。まちに、色がもどっていく。", "じいさまのばんごはんは、とっくにさめていたけれど、あたためなおせば、いいのだ。", "**TRUE END：ほしのあさ**"], "choices": [["おまけ「灰のメモ」を読む", 55], ["タイトルへ", 60]], "end": true}, "59": {"id": 59, "name": "GOOD END・よあけまで", "icon": "🌅", "paras": ["そのばん、ヨルとモモは、ホシのながい夢の話を聞いた。空のこと。おちてきた日 const LSKEY = "yoru_ash_found";
const app = document.getElementById("app");
function found(){ try { return JSON.parse(localStorage.getItem(LSKEY) || "[]"); } catch(e){ return []; } }
function mark(id){ const f = found(); if(!f.includes(id)){ f.push(id); try { localStorage.setItem(LSKEY, JSON.stringify(f)); } catch(e){} } }
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function badgesHtml(){
  const f = found();
  return '<div class="badges">' + BADGES.map(function(b){

    return '<span class="badge' + (got ? ' got' : '') + '">' + (got ? '\u2605 ' + b[1] : '\uff1f\uff1f\uff1f') + '</span>';
  }).join("") + '</div>';
}

function goTo(id){
  if(id === 60){ showTitle(); return; }
  const s = SCENES[String(id)];
  if(!s){ showTitle(); return; }
  if(s.end || id === 55){ mark(id); }
  let inner = '<div class="topbar"><span class="game">\u30e8\u30eb\u3068\u7070\u306e\u3046\u305f</span><button id="bgmbtn" onclick="bgmToggle()">'+(typeof bgmOn==="undefined"||bgmOn?'\u266a':'\u266a\u00d7')+'</button><button onclick="showTitle()">\u30bf\u30a4\u30c8\u30eb\u3078</button></div>';
  const illustSrc = SCENE_IMGS[String(id)];
  inner += '<div class="scene"><div class="scenehead"><span class="no">\u5834\u9762 ' + String(s.id).padStart(2,"0") + '</span><h2>' + s.icon + ' ' + esc(s.name) + '</h2></div>' + (illustSrc ? '<img class="scene-illust" src="' + illustSrc + '" alt="">' : '') + '<div class="paras">';
  let banner = "";
  s.paras.forEach(function(p){
    const m = p.match(/^\*\*([^*]+)\*\*(.*)$/);
    if(s.end && m && /(END|GAME OVER)/.test(m[1])){
      banner = '<div class="banner"><div class="big">' + esc(m[1]) + '</div>' + (m[2] ? '<div class="small">' + esc(m[2]) + '</div>' : '') + '</div>';
    } else {
      inner += '<p>' + md(p) + '</p>';
    }
  });
  inner += '</div>' + banner;
  if(s.choices.length){
    if(!s.end){ inner += '<div class="ask">' + (s.choices.length > 1 ? '\u3069\u3046\u3059\u308b\uff1f' : '\u3064\u304e\u3078') + '</div>'; }
    else { inner += '<div class="ask">\u00a0</div>'; }
    inner += '<div class="choices">' + s.choices.map(function(c){
      return '<button onclick="goTo(' + c[1] + ')">\u25b8 ' + esc(c[0]) + '</button>';
    }).join("") + '</div>';
  }
  inner += '</div>';
  app.innerHTML = inner;
  window.scrollTo(0,0);
}
// 灰のひらひら（アニメーション軽量・reduced motion尊重）
(function(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("ash"), cx = cv.getContext("2d");
  let W, H, ps;
  function reset(){
    W = cv.width = window.innerWidth; H = cv.height = window.innerHeight;
    ps = Array.from({length: 36}, function(){
      return {x: Math.random()*W, y: Math.random()*H, r: .8 + Math.random()*1.6, v: .25 + Math.random()*.55, d: (Math.random()-.5)*.3};
    });
  }
  reset();
  window.addEventListener("resize", reset);
  (function tick(){
    cx.clearRect(0,0,W,H);
    cx.fillStyle = "rgba(255,255,255,.22)";
    ps.forEach(function(p){
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
      p.y += p.v; p.x += p.d;
      if(p.y > H + 4){ p.y = -4; p.x = Math.random()*W; }
    });
    requestAnimationFrame(tick);
  })();
})();
const h = location.hash.match(/scene=(\d+)/);
if(h){ goTo(parseInt(h[1], 10)); } else { showTitle(); }

<script>
var bgmAC=null,bgmMaster=null,bgmTimer=null,bgmOn=true;
try{bgmOn=(localStorage.getItem("yoru1_bgm")!=="off");}catch(e){}
var BGMNOTES=[220,261.63,293.66,329.63,392,440,523.25];
function bgmInit(){if(bgmAC)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;bgmAC=new C();bgmMaster=bgmAC.createGain();bgmMaster.gain.value=0.05;bgmMaster.connect(bgmAC.destination);var d=bgmAC.createOscillator(),dg=bgmAC.createGain();d.type="triangle";d.frequency.value=55;dg.gain.value=0.01;d.connect(dg);dg.connect(bgmAC.destination);d.start();}
function bgmNote(){if(!bgmOn||!bgmAC)return;if(Math.random()<0.22)return;var t=bgmAC.currentTime,f=BGMNOTES[Math.floor(Math.random()*BGMNOTES.length)];var o=bgmAC.createOscillator(),g=bgmAC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.5,t+0.9);g.gain.linearRampToValueAtTime(0,t+3.8);o.connect(g);g.connect(bgmMaster);o.start(t);o.stop(t+4);if(Math.random()<0.35){var o2=bgmAC.createOscillator(),g2=bgmAC.createGain();o2.type="sine";o2.frequency.value=f*1.5;g2.gain.setValueAtTime(0,t+0.5);g2.gain.linearRampToValueAtTime(0.2,t+1.5);g2.gain.linearRampToValueAtTime(0,t+3.6);o2.connect(g2);g2.connect(bgmMaster);o2.start(t);o2.stop(t+4);}}
function bgmStart(){if(!bgmOn)return;bgmInit();if(!bgmAC)return;if(bgmAC.state==="suspended")bgmAC.resume();if(!bgmTimer){bgmNote();bgmTimer=setInterval(bgmNote,2400);}}
function bgmStop(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}if(bgmAC){bgmAC.suspend();}}
function bgmToggle(){bgmOn=!bgmOn;try{localStorage.setItem("yoru1_bgm",bgmOn?"on":"off");}catch(e){}if(bgmOn){bgmStart();}else{bgmStop();}var b=document.getElementById("bgmbtn");if(b){b.textContent=bgmOn?"\u266a":"\u266a\u00d7";}}
document.addEventListener("pointerdown",function(){if(bgmOn)bgmStart();});
</script>
